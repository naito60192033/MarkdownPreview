<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Markdown Preview</title>
<!-- favicon: 「md」の文字 + 青→紫のグラデーション(SVG を data URI で埋め込む。単独 HTML なので外部ファイルにしない)。
     HTML 出力(src/export.js)には付けない: 出力はいろいろなプロジェクトの資料として配布されるため -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%230969da'/%3E%3Cstop offset='1' stop-color='%238250df'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='7' fill='url(%23g)'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M5.5 23v-8M5.5 17a3 3 0 0 1 6 0v6M11.5 17a3 3 0 0 1 6 0v6'/%3E%3Ccircle cx='23' cy='19' r='4'/%3E%3Cpath d='M27 9v14'/%3E%3C/g%3E%3C/svg%3E" />
<!--@inline-css-->
</head>
<body>
  <!-- 起動画面: フォルダを選ぶ / 前回のフォルダを再許可 / 最近使ったフォルダ -->
  <div id="startScreen" class="screen start-screen">
    <div class="start-card">
      <h1>Markdown Preview</h1>
      <p class="start-desc">Markdown を編集・プレビューします。まずワークスペースにするフォルダを選んでください。</p>
      <div class="start-actions">
        <button id="pickFolderBtn" type="button" class="btn btn-primary">フォルダを選ぶ</button>
        <button id="reconnectBtn" type="button" class="btn" style="display:none;">前回のフォルダを再許可</button>
      </div>
      <div id="recentRootsSection" class="recent-roots" style="display:none;">
        <h2>最近使ったフォルダ</h2>
        <ul id="recentRootsList" class="recent-roots-list"></ul>
      </div>
      <p id="startError" class="start-error" style="display:none;"></p>
    </div>
  </div>

  <!-- メイン画面: ツリー | エディタ | プレビュー -->
  <div id="appScreen" class="screen app-screen" style="display:none;">
    <header class="toolbar">
      <button id="toggleSidebarBtn" type="button" class="icon-btn" title="サイドバーの表示切替">☰</button>
      <span id="workspaceName" class="workspace-name"></span>
      <div class="toolbar-spacer"></div>
      <div class="view-mode-group" role="group" aria-label="表示モード">
        <button data-view-mode="editor" type="button" class="view-mode-btn">エディタのみ</button>
        <button data-view-mode="both" type="button" class="view-mode-btn is-active">両方</button>
        <button data-view-mode="preview" type="button" class="view-mode-btn">プレビューのみ</button>
      </div>
      <button id="saveBtn" type="button" class="btn btn-primary">保存</button>
      <div class="export-menu">
        <button id="exportBtn" type="button" class="btn">HTML 出力 ▾</button>
        <div id="exportMenu" class="export-menu-list" style="display:none;">
          <button id="exportNormalBtn" type="button" class="export-menu-item">通常出力</button>
          <button id="exportStandaloneBtn" type="button" class="export-menu-item">1ファイル出力</button>
        </div>
      </div>
      <button id="settingsBtn" type="button" class="icon-btn" title="設定">⚙</button>
      <button id="switchFolderBtn" type="button" class="btn" title="ワークスペースのフォルダを切り替え">フォルダ切替</button>
    </header>

    <div id="notifyBar" class="notify-bar" style="display:none;">
      <span id="notifyBarText" class="notify-bar-text"></span>
      <div class="notify-bar-actions">
        <button id="notifyReloadBtn" type="button" class="btn btn-small">再読込</button>
        <button id="notifyDismissBtn" type="button" class="btn btn-small">無視</button>
      </div>
    </div>

    <div class="main" id="mainArea">
      <aside id="sidebar" class="sidebar">
        <div id="tree" class="tree"></div>
      </aside>
      <div id="editorPane" class="pane editor-pane">
        <div id="editorHost" class="editor-host"></div>
      </div>
      <div id="previewResizer" class="resizer resizer-vertical"></div>
      <div id="previewPane" class="pane preview-pane">
        <iframe id="preview" class="preview-frame" title="プレビュー"></iframe>
      </div>
    </div>

    <footer class="statusbar">
      <span id="statusPath" class="status-path"></span>
      <span id="statusSaved" class="status-saved"></span>
      <span id="statusMessage" class="status-message"></span>
    </footer>
  </div>

  <!-- 設定パネル -->
  <div id="settingsPanel" class="modal-overlay" style="display:none;">
    <div class="modal settings-modal">
      <h2>設定</h2>
      <label class="settings-row">
        <input type="checkbox" id="settingPollEnabled" />
        外部での変更を自動検知する
      </label>
      <label class="settings-row">
        <span>検知間隔(秒)</span>
        <input type="number" id="settingPollInterval" min="1" step="1" class="settings-input-number" />
      </label>
      <label class="settings-row">
        <span>CSS のパス(ルート相対)</span>
        <input type="text" id="settingCssPath" class="settings-input-text" />
      </label>
      <label class="settings-row">
        <input type="checkbox" id="settingUseStandardCss" />
        標準 CSS を使う
      </label>
      <p>オフにすると、CSS のパスのファイルだけを使います(アラートの見た目は常に適用されます)。</p>
      <div class="settings-row">
        <button type="button" id="exportStandardCssBtn" class="btn btn-small">標準 CSS を書き出す</button>
      </div>
      <h3 class="settings-subheading">アラートのタイトル</h3>
      <p>空欄にすると、タイトル文字を出さずアイコンだけを表示します。</p>
      <div class="settings-row settings-row-alert">
        <label for="settingAlertTitleNote">Note</label>
        <input type="text" id="settingAlertTitleNote" class="settings-input-text" />
        <button type="button" id="resetAlertTitleNote" class="btn btn-small">既定に戻す</button>
      </div>
      <div class="settings-row settings-row-alert">
        <label for="settingAlertTitleTip">Tip</label>
        <input type="text" id="settingAlertTitleTip" class="settings-input-text" />
        <button type="button" id="resetAlertTitleTip" class="btn btn-small">既定に戻す</button>
      </div>
      <div class="settings-row settings-row-alert">
        <label for="settingAlertTitleImportant">Important</label>
        <input type="text" id="settingAlertTitleImportant" class="settings-input-text" />
        <button type="button" id="resetAlertTitleImportant" class="btn btn-small">既定に戻す</button>
      </div>
      <div class="settings-row settings-row-alert">
        <label for="settingAlertTitleWarning">Warning</label>
        <input type="text" id="settingAlertTitleWarning" class="settings-input-text" />
        <button type="button" id="resetAlertTitleWarning" class="btn btn-small">既定に戻す</button>
      </div>
      <div class="settings-row settings-row-alert">
        <label for="settingAlertTitleCaution">Caution</label>
        <input type="text" id="settingAlertTitleCaution" class="settings-input-text" />
        <button type="button" id="resetAlertTitleCaution" class="btn btn-small">既定に戻す</button>
      </div>
      <div class="settings-row settings-row-alert">
        <label for="settingAlertTitleLink">Link</label>
        <input type="text" id="settingAlertTitleLink" class="settings-input-text" />
        <button type="button" id="resetAlertTitleLink" class="btn btn-small">既定に戻す</button>
      </div>
      <div class="settings-row settings-row-alert">
        <label for="settingAlertTitleMemo">Memo</label>
        <input type="text" id="settingAlertTitleMemo" class="settings-input-text" />
        <button type="button" id="resetAlertTitleMemo" class="btn btn-small">既定に戻す</button>
      </div>
      <div class="settings-row settings-row-alert">
        <label for="settingAlertTitleCheck">Check</label>
        <input type="text" id="settingAlertTitleCheck" class="settings-input-text" />
        <button type="button" id="resetAlertTitleCheck" class="btn btn-small">既定に戻す</button>
      </div>
      <div class="settings-row settings-row-alert">
        <label for="settingAlertTitleQuestion">Question</label>
        <input type="text" id="settingAlertTitleQuestion" class="settings-input-text" />
        <button type="button" id="resetAlertTitleQuestion" class="btn btn-small">既定に戻す</button>
      </div>
      <div class="modal-footer">
        <div></div>
        <button id="settingsCloseBtn" type="button" class="btn btn-primary">閉じる</button>
      </div>
    </div>
  </div>

  <!-- 保存時の競合モーダル -->
  <div id="conflictModal" class="modal-overlay" style="display:none;">
    <div class="modal conflict-modal">
      <h2>保存できませんでした</h2>
      <p>読み込んだ後に、ディスク上のファイルが他で更新されています。</p>
      <div class="modal-footer">
        <button id="conflictCancelBtn" type="button" class="btn">キャンセル</button>
        <div class="right">
          <button id="conflictReloadBtn" type="button" class="btn">破棄して再読込</button>
          <button id="conflictOverwriteBtn" type="button" class="btn btn-danger">上書き保存</button>
        </div>
      </div>
    </div>
  </div>
<!--@inline-js-->
</body>
</html>
